version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_visibility_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AI Visibility Platform
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secret_password
      - POSTGRES_DB=ai_visibility_db
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_secret_password@db:5432/ai_visibility_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: ai_visibility_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secret_password
      - POSTGRES_DB=ai_visibility_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_visibility_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
